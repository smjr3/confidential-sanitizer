name: Build npm package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: confidential-sanitizer-npm
          path: packages/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
